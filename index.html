<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOSTER • Zombie Defense 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#eee;font-family:Arial,Helvetica,sans-serif}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:18px;right:18px;top:15px;display:flex;gap:10px;align-items:flex-start}.card{background:rgba(9,11,13,.82);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 35px rgba(0,0,0,.45);backdrop-filter:blur(8px);border-radius:10px;padding:11px 14px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#92989e;text-transform:uppercase;letter-spacing:1px}.boss{position:absolute;left:50%;top:17px;transform:translateX(-50%);width:min(650px,55vw);display:none}.boss .name{text-align:center;font-weight:900;letter-spacing:3px}.bar{height:12px;background:#191b1d;border-radius:99px;overflow:hidden;border:1px solid #3a3a3a;margin-top:7px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a1111,#d83b24,#f09a3a);box-shadow:0 0 16px #d33}.left{position:absolute;left:18px;bottom:18px;width:320px}.right{position:absolute;right:18px;bottom:18px;width:330px;pointer-events:auto}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.controls button{pointer-events:auto;background:#15181b;border:1px solid #34383c;color:#eee;padding:11px;border-radius:7px;font-weight:700}.controls button:hover{background:#22272b}.weapon{font-size:13px;color:#bfc4c8}.weapon strong{color:#fff;font-size:18px}.hint{font-size:11px;color:#8d9398;line-height:1.5}.cross{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:.75}.cross:before,.cross:after{content:"";position:absolute;background:#ddd}.cross:before{width:2px;height:34px;left:16px;top:0}.cross:after{height:2px;width:34px;left:0;top:16px}.cross i{position:absolute;width:5px;height:5px;border:1px solid #fff;border-radius:50%;left:14px;top:14px}.hit{position:absolute;left:50%;top:50%;width:55px;height:55px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.4);opacity:0}.hit.show{animation:hit .15s ease-out}@keyframes hit{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}.warning{position:absolute;left:50%;top:19%;transform:translateX(-50%);font-weight:900;letter-spacing:4px;color:#ffb46a;text-shadow:0 2px 18px #000;opacity:0}.warning.show{animation:warn 1.2s ease-out}@keyframes warn{0%{opacity:0;transform:translateX(-50%) scale(.8)}15%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0}}.toast{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.15);padding:9px 14px;border-radius:8px;opacity:0}.toast.show{animation:toast 1.7s ease}@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}.mobile{display:none}@media(max-width:900px){.right{width:280px}.left{width:280px}.stats{display:none}}@media(max-width:650px){.right,.left{width:calc(100vw - 36px)}.left{bottom:100px}.right{bottom:10px}.top{left:8px;right:8px}.boss{width:80vw}.controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
 <div class="top"><div class="card stats"><div class="stat"><span>Crédits</span><b id="money">0</b></div><div class="stat"><span>Vague</span><b id="wave">1</b></div><div class="stat"><span>Kills</span><b id="kills">0</b></div><div class="stat"><span>Base</span><b id="base">100%</b></div><div class="stat"><span>Score</span><b id="score">0</b></div></div></div>
 <div class="boss card" id="bossUI"><div class="name" id="bossName">BOSS</div><div class="bar"><i id="bossHP"></i></div></div>
 <div class="cross"><i></i></div><div class="hit" id="hit"></div><div class="warning" id="warning">ALERTE BOSS</div><div class="toast" id="toast"></div>
 <div class="left card"><div class="weapon">SYSTÈME D'ARMEMENT<br><strong id="weapon">Mitrailleuse lourde</strong></div><div class="hint" id="turretInfo">Tourelle automatique • Niveau 1</div><div class="controls"><button id="damage">+ Dégâts <span>100</span></button><button id="rate">+ Cadence <span>140</span></button><button id="range">+ Portée <span>120</span></button><button id="armor">+ Blindage <span>180</span></button></div></div>
 <div class="right card"><div><b>ARSENAL</b></div><div class="controls"><button id="weaponUp">Évolution arme</button><button id="overdrive">OVERDRIVE</button><button id="strike">FRAPPE ORBITALE</button><button id="repair">RÉPARER</button></div><div class="hint" style="margin-top:9px">Souris : viser • Clic : tir manuel • Espace : tir automatique ciblé • R : réparer • F : frappe orbitale</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090b0c);
scene.fog=new THREE.FogExp2(0x0a0d0f,0.018);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
camera.position.set(0,18,29);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
root.appendChild(renderer.domElement);
const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const state={money:1000,wave:1,kills:0,score:0,base:100,damage:24,rate:1.7,range:31,armor:0,weapon:1,over:0,nextWave:0,spawn:0,spawned:0,total:0,boss:null,paused:false};
const enemies=[];const bullets=[];const particles=[];const shockwaves=[];const buildings=[];const lights=[];
const mats={
 ground:new THREE.MeshStandardMaterial({color:0x25282a,roughness:.94,metalness:.03}),
 road:new THREE.MeshStandardMaterial({color:0x17191a,roughness:.9,metalness:.05}),
 concrete:new THREE.MeshStandardMaterial({color:0x4b4d4d,roughness:.9}),
 concreteDark:new THREE.MeshStandardMaterial({color:0x292b2b,roughness:.95}),
 steel:new THREE.MeshStandardMaterial({color:0x3d4142,roughness:.46,metalness:.82}),
 steelDark:new THREE.MeshStandardMaterial({color:0x171a1b,roughness:.38,metalness:.9}),
 rubber:new THREE.MeshStandardMaterial({color:0x090a0a,roughness:.8,metalness:.05}),
 skin:new THREE.MeshStandardMaterial({color:0x68625a,roughness:.95,metalness:0}),
 skinDark:new THREE.MeshStandardMaterial({color:0x3e403c,roughness:1}),
 cloth:new THREE.MeshStandardMaterial({color:0x24272a,roughness:1}),
 cloth2:new THREE.MeshStandardMaterial({color:0x363a3c,roughness:.96}),
 red:new THREE.MeshStandardMaterial({color:0x721d16,roughness:.8,metalness:.1}),
 glass:new THREE.MeshPhysicalMaterial({color:0x162126,roughness:.15,metalness:.45,transmission:.25,transparent:true,opacity:.8}),
 muzzle:new THREE.MeshBasicMaterial({color:0xffc87a}),
 bullet:new THREE.MeshBasicMaterial({color:0xffd48a}),
};
function box(w,h,d,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function cyl(r1,r2,h,m,x=0,y=0,z=0,seg=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function sphere(r,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function addLight(type,color,intensity,distance,x,y,z){let l=new type(color,intensity,distance);l.position.set(x,y,z);l.castShadow=type===THREE.PointLight||type===THREE.SpotLight;if(l.castShadow){l.shadow.mapSize.set(1024,1024);l.shadow.bias=-.0002}scene.add(l);lights.push(l);return l}
scene.add(new THREE.HemisphereLight(0x8c9aaa,0x171717,1.4));
const sun=new THREE.DirectionalLight(0xd8d2c3,2.2);sun.position.set(-30,55,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;scene.add(sun);
addLight(THREE.PointLight,0x8fb7ff,22,75,-25,12,-20);addLight(THREE.PointLight,0xff9b55,15,55,25,8,-8);
// ground
box(180,.5,180,mats.ground,0,-.3,0);
box(18,.06,180,mats.road,0,.02,0);
box(180,.06,18,mats.road,0,.025,0);
for(let z=-80;z<=80;z+=6){box(.18,.035,2.5,new THREE.MeshStandardMaterial({color:0xb2a78c,roughness:.8}),0,.07,z)}
for(let x=-80;x<=80;x+=6){box(2.5,.035,.18,new THREE.MeshStandardMaterial({color:0xb2a78c,roughness:.8}),x,.075,0)}
// sidewalks and ruined blocks
for(let x of [-34,34])box(26,.25,170,mats.concreteDark,x,.1,0);
for(let z of [-34,34])box(170,.25,26,mats.concreteDark,0,.1,z);
function makeBuilding(x,z,w,d,h,seed){const g=new THREE.Group();g.position.set(x,0,z);let m=new THREE.MeshStandardMaterial({color:0x36393a,roughness:.98});let body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);body.position.y=h/2;body.castShadow=body.receiveShadow=true;g.add(body);for(let y=3;y<h-1;y+=3.1){for(let xx=-w/2+2;xx<w/2-1;xx+=3.5){if((Math.floor(xx)+y+seed)%4!==0){let win=new THREE.Mesh(new THREE.BoxGeometry(1.5,.9,.08),new THREE.MeshStandardMaterial({color:0x121b1f,roughness:.3,metalness:.2}));win.position.set(xx,y,d/2+.05);g.add(win);}}}if(seed%2){let rubble=new THREE.Mesh(new THREE.BoxGeometry(w*.45,.5,d*.35),mats.concrete);rubble.position.set(-w*.1,.25,-d*.2);rubble.rotation.y=.2;g.add(rubble)}scene.add(g);buildings.push(g)}
makeBuilding(-60,-58,22,20,18,1);makeBuilding(-34,-62,18,15,12,2);makeBuilding(58,-58,24,19,24,3);makeBuilding(34,-64,16,14,10,4);makeBuilding(-63,54,23,20,22,5);makeBuilding(63,52,26,21,16,6);makeBuilding(0,-70,30,12,11,7);
// debris
for(let i=0;i<85;i++){let a=Math.random()*Math.PI*2,r=15+Math.random()*65,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<13&&Math.abs(z)<13)continue;let s=.15+Math.random()*.65;let o=box(s*(.5+Math.random()),s,s*(.4+Math.random()),Math.random()>.55?mats.concrete:mats.steelDark,x,s/2,z);o.rotation.set(Math.random()*2,Math.random()*3,Math.random()*2)}
// turret
const turret=new THREE.Group();turret.position.set(0,0,7);scene.add(turret);
const base=cyl(3.8,4.2,1.1,mats.steelDark,0,.6,0,32);turret.add(base.clone());
const ring=cyl(3.15,3.15,.35,mats.steel,0,1.25,0,32);turret.add(ring.clone());
const body=new THREE.Mesh(new THREE.BoxGeometry(4.6,2.2,3.5),mats.steel);body.position.y=2.35;body.castShadow=true;turret.add(body);
const front=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.3,.35),mats.steelDark);front.position.set(0,2.55,-1.85);turret.add(front);
const optics=sphere(.34,mats.glass,0,3.65,-.9);turret.add(optics.clone());
for(let sx of [-1.15,1.15]){let gun=new THREE.Group();gun.position.set(sx,2.8,-1.8);let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.24,.28,4.6,16),mats.steelDark);barrel.rotation.x=Math.PI/2;barrel.position.z=-2.15;gun.add(barrel);let muzzle=new THREE.Mesh(new THREE.CylinderGeometry(.31,.36,.32,16),mats.steel);muzzle.rotation.x=Math.PI/2;muzzle.position.z=-4.45;gun.add(muzzle);gun.userData.recoil=0;turret.add(gun)}
for(let sx of [-1.9,1.9]){let plate=new THREE.Mesh(new THREE.BoxGeometry(.35,1.5,2.7),mats.steelDark);plate.position.set(sx,2.35,.1);turret.add(plate)}
// beacon
const beacon=cyl(.16,.16,.45,mats.red,0,4.1,1.1,12);turret.add(beacon.clone());
function enemyMaterial(type){return type==='tank'?mats.skinDark:type==='fast'?new THREE.MeshStandardMaterial({color:0x525b57,roughness:.96}):mats.skin}
function makeZombie(type='normal',boss=false){const g=new THREE.Group();g.userData={type,boss,hp:boss?1600:(type==='tank'?260:type==='fast'?75:110),max:boss?1600:(type==='tank'?260:type==='fast'?75:110),speed:boss?1.1:(type==='tank'?.72:type==='fast'?2.0:1.15),hit:0,phase:1};const skin=enemyMaterial(type);const torso=new THREE.Mesh(new THREE.BoxGeometry(boss?2.5:1.15,boss?3.1:1.75,boss?1.55:0.72),type==='tank'?mats.steelDark:mats.cloth);torso.position.y=boss?3.1:1.65;torso.castShadow=true;g.add(torso);const chest=new THREE.Mesh(new THREE.BoxGeometry(boss?2.7:1.3,boss?1.15:.65,boss?1.7:.78),type==='tank'?mats.steel:mats.cloth2);chest.position.y=boss?3.55:2.0;chest.castShadow=true;g.add(chest);const head=sphere(boss?1.15:.58,skin,0,boss?5.25:3.05,0);g.add(head);const jaw=new THREE.Mesh(new THREE.BoxGeometry(boss?1.4:.62,boss?.48:.26,boss?.8:.38),mats.skinDark);jaw.position.set(0,boss?4.72:2.78,-.34);g.add(jaw);for(let sx of [-1,1]){let arm=new THREE.Mesh(new THREE.CylinderGeometry(boss?.35:.16,boss?.28:.13,boss?2.7:1.9,10),skin);arm.position.set(sx*(boss?1.55:.86),boss?3.0:1.55,0);arm.rotation.z=sx*(boss?.28:.12);arm.castShadow=true;g.add(arm);let leg=new THREE.Mesh(new THREE.CylinderGeometry(boss?.38:.18,boss?.3:.15,boss?2.7:2.0,10),mats.cloth);leg.position.set(sx*(boss?.72:.32),boss?1.25:0.65,0);leg.castShadow=true;g.add(leg)}
const eyeMat=new THREE.MeshBasicMaterial({color:boss?0xff8a4d:0xd14b31});for(let sx of [-.22,.22]){let e=sphere(boss?.12:.07,eyeMat,sx,boss?5.38:3.15,-.52);g.add(e)}
if(boss){for(let i=0;i<6;i++){let p=cyl(.12,.12,2.4,mats.steelDark,0,4.7,0,8);p.rotation.z=(i-2.5)*.25;p.position.x=(i-2.5)*.32;g.add(p)}}
g.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true});scene.add(g);return g}
function spawnEnemy(type='normal',boss=false){const e=makeZombie(type,boss);let side=Math.floor(Math.random()*4),x,z;if(side===0){x=-48+Math.random()*96;z=-68}else if(side===1){x=48;z=-55+Math.random()*110}else if(side===2){x=-48+Math.random()*96;z=68}else{x=-48;z=-55+Math.random()*110}e.position.set(x,0,z);if(boss)e.position.y=0;enemies.push(e);if(boss)state.boss=e;return e}
function distanceToBase(e){return Math.hypot(e.position.x,e.position.z-7)}
function targetEnemy(){let best=null,bd=Infinity;for(const e of enemies){let d=Math.hypot(e.position.x,e.position.z-7);if(d<=state.range&&d<bd){best=e;bd=d}}return best}
function shoot(target,manual=false){if(!target||state.paused)return;const origin=new THREE.Vector3(0,3,-3.8);turret.localToWorld(origin);const end=target.position.clone();end.y+=target.userData.boss?3.3:1.9;const dir=end.clone().sub(origin).normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),mats.bullet);b.position.copy(origin);scene.add(b);b.userData={v:dir.multiplyScalar(65),life:1.2,target,damage:state.damage*(state.weapon>3?1.3:1)*(state.over>0?2.2:1)};bullets.push(b);const flash=sphere(.18,mats.muzzle,origin.x,origin.y,origin.z);setTimeout(()=>scene.remove(flash),45);for(const c of turret.children){if(c.userData.recoil!==undefined)c.userData.recoil=.12}if(manual)flashHit();}
function flashHit(){const h=document.getElementById('hit');h.classList.remove('show');void h.offsetWidth;h.classList.add('show')}
function damageEnemy(e,dmg){if(!e||!e.parent)return;let armor=e.userData.boss?0.8:e.userData.type==='tank'?.72:1;e.userData.hp-=dmg*armor;e.userData.hit=.12;spawnImpact(e.position.clone().add(new THREE.Vector3(0,2,0)));if(e.userData.hp<=0)killEnemy(e)}
function killEnemy(e){const i=enemies.indexOf(e);if(i<0)return;enemies.splice(i,1);let reward=e.userData.boss?3000:e.userData.type==='tank'?80:e.userData.type==='fast'?55:40;state.money+=reward;state.kills++;state.score+=reward*10;if(e.userData.boss){state.boss=null;document.getElementById('bossUI').style.display='none';state.wave++;state.spawned=0;state.total=0;state.nextWave=3;toast('BOSS ÉLIMINÉ • +'+reward+' CRÉDITS');explosion(e.position.clone(),3.5)}else{if(Math.random()<.2)state.money+=10;explosion(e.position.clone().add(new THREE.Vector3(0,1.4,0)),.65)}scene.remove(e)}
function spawnImpact(pos){for(let i=0;i<6;i++){const p=sphere(.045+Math.random()*.06,new THREE.MeshBasicMaterial({color:Math.random()>.5?0xd4b083:0x8a8f91}),pos.x,pos.y,pos.z);p.userData={v:new THREE.Vector3((Math.random()-.5)*3,.5+Math.random()*2,(Math.random()-.5)*3),life:.3+Math.random()*.3};particles.push(p)}}
function explosion(pos,size=1){for(let i=0;i<28*size;i++){const p=sphere(.035+Math.random()*.11,new THREE.MeshBasicMaterial({color:Math.random()>.35?0xd36b34:0xa9a39a}),pos.x,pos.y,pos.z);p.userData={v:new THREE.Vector3((Math.random()-.5)*7,Math.random()*7,(Math.random()-.5)*7),life:.5+Math.random()*.9};particles.push(p)}shockwaves.push({p:pos.clone(),r:.2,max:3*size,life:.35})}
function bossAttack(b){if(!b)return;let phase=b.userData.hp/b.userData.max;if(phase<.76&&b.userData.phase===1){b.userData.phase=2;toast('PHASE 2 • RENFORTS');for(let i=0;i<5;i++)spawnEnemy(Math.random()>.5?'fast':'normal')}if(phase<.51&&b.userData.phase===2){b.userData.phase=3;toast('PHASE 3 • ONDE DE CHOC');shockwaves.push({p:new THREE.Vector3(b.position.x,1,b.position.z),r:.2,max:18,life:.9});state.base=Math.max(1,state.base-12)}if(phase<.26&&b.userData.phase===3){b.userData.phase=4;toast('PHASE 4 • ENRAGE');for(let i=0;i<8;i++)spawnEnemy('fast')};if(Math.random()<.008){state.base=Math.max(1,state.base-1);toast('ATTAQUE DU BOSS • BASE -1%')}}
function nextWave(){state.wave++;state.spawned=0;state.total=8+Math.floor(state.wave*2.4);state.spawn=0;if(state.wave%5===0){let b=spawnEnemy('tank',true);b.userData.max=2200+state.wave*450;b.userData.hp=b.userData.max;document.getElementById('bossUI').style.display='block';document.getElementById('bossName').textContent=['NECRO TITAN','IRON COLOSSUS','VOID BRUTE','OMEGA MUTANT'][Math.floor(Math.random()*4)];document.getElementById('warning').classList.remove('show');void document.getElementById('warning').offsetWidth;document.getElementById('warning').classList.add('show')}else{state.total=7+Math.floor(state.wave*2.2)}}
function updateEnemies(dt){for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];const dx=-e.position.x,dz=7-e.position.z;const d=Math.hypot(dx,dz);if(d<4){state.base=Math.max(0,state.base-(e.userData.boss?8:2)*dt);e.rotation.y+=dt*2;continue}e.position.x+=dx/d*e.userData.speed*dt;e.position.z+=dz/d*e.userData.speed*dt;e.rotation.y=Math.atan2(dx,dz);if(e.userData.hit>0){e.userData.hit-=dt;e.position.y=Math.sin(e.userData.hit*50)*.05}else e.position.y=0;if(e.userData.boss)bossAttack(e)} }
function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.addScaledVector(b.userData.v,dt);b.userData.life-=dt;let t=b.userData.target;if(t&&t.parent){let d=b.position.distanceTo(t.position.clone().add(new THREE.Vector3(0,t.userData.boss?3.2:1.7,0)));if(d<1.3){damageEnemy(t,b.userData.damage);scene.remove(b);bullets.splice(i,1);continue}}if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1)}}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=8*dt;p.userData.life-=dt;p.scale.multiplyScalar(.96);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}for(let i=shockwaves.length-1;i>=0;i--){let s=shockwaves[i];s.r+=dt*30;s.life-=dt;if(s.life<=0)shockwaves.splice(i,1)}}
let autoTimer=0;let last=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);if(!state.paused){state.over=Math.max(0,state.over-dt);state.nextWave=Math.max(0,state.nextWave-dt);state.spawn=Math.max(0,state.spawn-dt);autoTimer-=dt;if(state.wave===1&&state.spawned===0&&state.total===0){state.total=8}if(state.spawned<state.total&&!state.boss&&state.spawn<=0){let r=Math.random();spawnEnemy(r<.12&&state.wave>3?'tank':r<.3?'fast':'normal');state.spawned++;state.spawn=Math.max(.22,1.15-state.wave*.025)}if(state.spawned>=state.total&&enemies.filter(e=>!e.userData.boss).length===0&&!state.boss&&state.nextWave<=0){nextWave();state.nextWave=2.5}if(autoTimer<=0){let t=targetEnemy();if(t){shoot(t);autoTimer=1/state.rate}}updateEnemies(dt);updateBullets(dt);updateParticles(dt)}updateUI();renderer.render(scene,camera)}
function updateUI(){money.textContent=Math.floor(state.money);wave.textContent=state.wave;kills.textContent=state.kills;base.textContent=Math.floor(state.base)+'%';score.textContent=Math.floor(state.score);turretInfo.textContent=`Tourelle automatique • Niveau ${state.weapon} • Dégâts ${Math.floor(state.damage)} • Cadence ${state.rate.toFixed(1)}/s`;weapon.textContent=['Mitrailleuse lourde','Double canon','Plasma industriel','Railgun','Barrage magnétique','OMEGA CORE'][Math.min(state.weapon-1,5)];if(state.boss){bossHP.style.width=Math.max(0,state.boss.userData.hp/state.boss.userData.max*100)+'%';bossName.textContent=bossName.textContent||'BOSS'}}
function buy(kind,cost){if(state.money<cost){toast('Crédits insuffisants');return false}state.money-=cost;return true}
damage.onclick=()=>{let c=100+state.damage*5;if(buy('d',c)){state.damage+=8;toast('DÉGÂTS AMÉLIORÉS')}};rate.onclick=()=>{let c=140+state.rate*70;if(buy('r',c)){state.rate+=.25;toast('CADENCE AMÉLIORÉE')}};range.onclick=()=>{let c=120+state.range*10;if(buy('g',c)){state.range+=3;toast('PORTÉE AMÉLIORÉE')}};armor.onclick=()=>{let c=180+state.armor*120;if(buy('a',c)){state.armor++;state.base=Math.min(100,state.base+5);toast('BLINDAGE +5%')}};
weaponUp.onclick=()=>{let c=500+state.weapon*850;if(state.weapon>=6){toast('OMEGA CORE MAX');return}if(buy('w',c)){state.weapon++;state.damage*=1.35;state.rate*=1.08;toast('NOUVELLE ARME : '+weapon.textContent)}};
overdrive.onclick=()=>{if(state.money>=300){state.money-=300;state.over=12;toast('OVERDRIVE • DÉGÂTS x2.2')}};strike.onclick=()=>{if(state.money<700){toast('700 crédits nécessaires');return}state.money-=700;for(const e of [...enemies]){if(e.userData.boss)damageEnemy(e,450);else killEnemy(e)}explosion(new THREE.Vector3(0,3,0),5);toast('FRAPPE ORBITALE')};repair.onclick=()=>{if(state.money<180){toast('180 crédits nécessaires');return}state.money-=180;state.base=Math.min(100,state.base+18);toast('BASE RÉPARÉE')};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('show');void x.offsetWidth;x.classList.add('show')}
window.addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1});window.addEventListener('pointerdown',()=>{raycaster.setFromCamera(mouse,camera);let t=targetEnemy();if(t)shoot(t,true)});window.addEventListener('keydown',e=>{if(e.code==='KeyR')repair.click();if(e.code==='KeyF')strike.click();if(e.code==='Space'){e.preventDefault();let t=targetEnemy();if(t)shoot(t,true)}if(e.code==='Escape')state.paused=!state.paused});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
loop();toast('SYSTÈME EN LIGNE • DÉFENDEZ LA BASE');
})();
</script>
