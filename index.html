<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOSTER • Zombie Defense</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#eee;font-family:Arial,Helvetica,sans-serif}button{border:1px solid #30343a;background:#121519;color:#eee;border-radius:7px;padding:10px;cursor:pointer}button:hover{background:#1a1f24;border-color:#777}.app{height:100%;display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:64px}.top{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:10px 16px;background:#090b0d;border-bottom:1px solid #292d31;z-index:3}.logo{font-weight:900;font-size:22px;letter-spacing:2px;margin-right:18px}.logo span{color:#d52f36}.stat{padding:8px 11px;background:#101317;border:1px solid #25292e;border-radius:7px;font-size:13px}.stat b{font-size:15px}.top button{margin-left:auto}.side,.right{background:#0a0c0f;padding:14px;overflow:auto}.side{border-right:1px solid #292d31}.right{border-left:1px solid #292d31}.title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin:0 0 9px}.group{margin-bottom:18px}.upgrade{width:100%;display:flex;justify-content:space-between;text-align:left;margin-bottom:7px}.upgrade small{display:block;color:#85898d;margin-top:3px}.price{font-weight:bold;color:#e5bd52}.game{position:relative;background:#111}.game canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:12px;pointer-events:none}.mission,.warning{display:inline-block;background:#080a0dcc;border:1px solid #34383d;padding:9px 12px;border-radius:6px}.mission b{color:#ddd}.warning{position:absolute;left:50%;top:16px;transform:translateX(-50%);color:#ef4c55;font-weight:900;display:none}.boss{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(600px,70%);display:none}.bossName{text-align:center;font-weight:900;font-size:13px;margin-bottom:5px}.bar{height:11px;background:#1a1c20;border:1px solid #34383d;border-radius:5px;overflow:hidden}.fill{height:100%;background:#bd3038}.bottom{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;background:#080a0dcc;border:1px solid #30343a;padding:8px;border-radius:7px;pointer-events:auto}.ability{min-width:105px}.ability small{display:block;color:#777;font-size:10px}.panel{background:#101317;border:1px solid #282c31;border-radius:7px;padding:11px;margin-bottom:10px}.meter{margin:8px 0}.meter label{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-bottom:4px}.meter .fill{height:8px}.log{height:260px;overflow:hidden;color:#969b9f;font:12px Consolas,monospace}.log div{padding:3px 0;border-bottom:1px solid #171a1d}.arsenal b{color:#ddd}.arsenal span{color:#888;font-size:12px}.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);padding:12px 18px;background:#0a0c0fcc;border:1px solid #aaa;border-radius:6px;opacity:0;pointer-events:none}.toast.show{animation:t 1.8s ease}.small{font-size:11px;color:#888;line-height:1.5}@keyframes t{0%{opacity:0;top:19%}15%,75%{opacity:1;top:22%}100%{opacity:0;top:25%}}@media(max-width:1050px){.app{grid-template-columns:205px 1fr}.right{display:none}.top{grid-column:1/3}.logo{font-size:17px}.stat:nth-of-type(n+4){display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo">BOOSTER <span>DEFENSE</span></div>
 <div class="stat">CRÉDITS <b id="money">0</b></div><div class="stat">VAGUE <b id="wave">1</b></div><div class="stat">KILLS <b id="kills">0</b></div><div class="stat">SCORE <b id="score">0</b></div>
 <button id="pause">⏸</button>
</header>
<aside class="side">
 <div class="group"><div class="title">Tourelle</div>
  <button class="upgrade" data-up="damage"><span>Puissance<small id="damageLv">Niv. 1</small></span><span class="price" id="damageCost">60</span></button>
  <button class="upgrade" data-up="fire"><span>Cadence de tir<small id="fireLv">Niv. 1</small></span><span class="price" id="fireCost">90</span></button>
  <button class="upgrade" data-up="range"><span>Optique / portée<small id="rangeLv">Niv. 1</small></span><span class="price" id="rangeCost">100</span></button>
  <button class="upgrade" data-up="crit"><span>Précision critique<small id="critLv">Niv. 1</small></span><span class="price" id="critCost">140</span></button>
  <button class="upgrade" data-up="armor"><span>Blindage<small id="armorLv">Niv. 1</small></span><span class="price" id="armorCost">180</span></button>
 </div>
 <div class="group"><div class="title">Arsenal</div><button class="upgrade" data-up="weapon"><span>Changer d'arme<small id="weaponLv">Fusil automatique</small></span><span class="price" id="weaponCost">350</span></button></div>
 <div class="group"><div class="title">Système</div><button id="save">💾 Sauvegarder</button> <button id="reset">↻ Reset</button></div>
</aside>
<main class="game"><canvas id="c"></canvas><div class="hud"><div class="mission">OBJECTIF · <b id="objective">Survis à la vague 1</b></div><div id="warning" class="warning">⚠ ALERTE BOSS</div><div id="boss" class="boss"><div class="bossName" id="bossName">BOSS</div><div class="bar"><div class="fill" id="bossFill"></div></div></div><div id="toast" class="toast"></div><div class="bottom"><button class="ability" id="overdrive"><b>OVERDRIVE</b><small>boost dégâts</small></button><button class="ability" id="strike"><b>FRAPPE</b><small>artillerie</small></button><button class="ability" id="freeze"><b>EMP</b><small>ralentit les ennemis</small></button><button class="ability" id="repair"><b>RÉPARER</b><small>base +20%</small></button></div></div></main>
<aside class="right">
 <div class="group"><div class="title">État de la base</div><div class="panel"><div class="meter"><label><span>Intégrité</span><span id="hpText">100%</span></label><div class="bar"><div class="fill" id="hpFill" style="width:100%"></div></div></div><div class="meter"><label><span>Énergie</span><span id="energyText">100%</span></label><div class="bar"><div class="fill" id="energyFill" style="width:100%;background:#999"></div></div></div><div class="meter"><label><span>Surchauffe</span><span id="heatText">0%</span></label><div class="bar"><div class="fill" id="heatFill" style="width:0%;background:#b97837"></div></div></div></div></div>
 <div class="group"><div class="title">Arme équipée</div><div class="panel arsenal" id="arsenal">Fusil automatique</div></div>
 <div class="group"><div class="title">Journal</div><div class="panel log" id="log"></div></div>
 <div class="small">Les ennemis deviennent plus rapides et résistants. Tous les 5 niveaux, un boss arrive avec plusieurs phases.</div>
</aside>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;
const $=id=>document.getElementById(id);
const state={money:500,wave:1,kills:0,score:0,hp:100,energy:100,heat:0,paused:false,damage:14,fire:1,range:1,crit:.05,armor:0,weapon:0,overdrive:0,emp:0,levels:{damage:1,fire:1,range:1,crit:1,armor:0,weapon:1}};
const weapons=[['Fusil automatique',14,1,1],['Double canon',22,1.15,2],['Mitrailleuse lourde',31,1.28,1],['Canon plasma',48,1.35,1],['Railgun',82,1.55,1],['OMEGA CORE',140,1.85,3]];
let enemies=[],bullets=[],particles=[],shells=[],floats=[],boss=null,time=0,spawn=0,shootTimer=0,shake=0,nextWave=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function base(){return{x:W/2,y:H*.68}}
function log(t){const d=document.createElement('div');d.textContent='› '+t;$('log').prepend(d);while($('log').children.length>22)$('log').lastChild.remove()}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('show');void $('toast').offsetWidth;$('toast').classList.add('show')}
function cost(t){const b={damage:60,fire:90,range:100,crit:140,armor:180,weapon:350}[t];return Math.floor(b*Math.pow(1.55,state.levels[t]||0))}
function save(){localStorage.setItem('boosterRealistic',JSON.stringify(state));log('Sauvegarde effectuée')}
function load(){try{const x=JSON.parse(localStorage.getItem('boosterRealistic'));if(x)Object.assign(state,x)}catch(e){}}
load();
function ui(){
 $('money').textContent=Math.floor(state.money).toLocaleString('fr-FR');$('wave').textContent=state.wave;$('kills').textContent=state.kills;$('score').textContent=Math.floor(state.score).toLocaleString('fr-FR');$('hpText').textContent=Math.max(0,Math.floor(state.hp))+'%';$('energyText').textContent=Math.floor(state.energy)+'%';$('heatText').textContent=Math.floor(state.heat)+'%';$('hpFill').style.width=Math.max(0,state.hp)+'%';$('energyFill').style.width=state.energy+'%';$('heatFill').style.width=state.heat+'%';
 for(const t of ['damage','fire','range','crit','armor']){$(t+'Lv').textContent='Niv. '+state.levels[t];$(t+'Cost').textContent=cost(t).toLocaleString('fr-FR')}
 $('weaponLv').textContent=weapons[Math.min(state.weapon,weapons.length-1)][0];$('weaponCost').textContent=cost('weapon').toLocaleString('fr-FR');$('arsenal').innerHTML='<b>'+weapons[Math.min(state.weapon,weapons.length-1)][0]+'</b><br><span>Dégâts '+weapons[Math.min(state.weapon,weapons.length-1)][1]+' · Cadence x'+weapons[Math.min(state.weapon,weapons.length-1)][2]+'</span>';$('objective').textContent=boss?'Détruis le '+boss.name:(state.wave%5===0?'BOSS EN APPROCHE':'Survis à la vague '+state.wave);
}
function upgrade(t){const c=cost(t);if(state.money<c){toast('Crédits insuffisants');return}if(t==='weapon'&&state.weapon>=weapons.length-1){toast('OMEGA CORE MAX');return}state.money-=c;state.levels[t]++;if(t==='damage')state.damage+=6;if(t==='fire')state.fire+=.22;if(t==='range')state.range+=.11;if(t==='crit')state.crit+=.04;if(t==='armor')state.armor+=.12;if(t==='weapon')state.weapon++;toast('UPGRADE '+t.toUpperCase());log('Upgrade '+t+' → niveau '+state.levels[t]);save();ui()}
document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>upgrade(b.dataset.up));
function spawnEnemy(type='walker'){
 const b=base(),a=Math.random()*Math.PI*2,r=Math.max(W,H)*.6+100;let e={x:b.x+Math.cos(a)*r,y:b.y+Math.sin(a)*r,r:18,hp:35+state.wave*9,speed:25+state.wave*1.4,damage:2,value:18,type,phase:Math.random()*6.28};
 if(type==='runner'){e.r=14;e.hp*=.65;e.speed*=1.9;e.value*=1.7;e.damage=2.5}if(type==='brute'){e.r=26;e.hp*=4.4;e.speed*=.48;e.value*=3.2;e.damage=5}if(type==='soldier'){e.r=20;e.hp*=2;e.speed*=.75;e.value*=2.2;e.damage=3}
 enemies.push(e)
}
function spawnBoss(){const b=base();const names=['THE WARDEN','IRON REVENANT','NIGHT COLOSSUS','OMEGA BEAST'];boss={x:W/2,y:H*.22,r:65,hp:1400+state.wave*260,max:1400+state.wave*260,name:names[(state.wave/5-1)%names.length],phase:1,t:0,shield:250,maxShield:250,attack:3};$('boss').style.display='block';$('warning').style.display='block';setTimeout(()=>$('warning').style.display='none',2300);log('BOSS '+boss.name+' DÉTECTÉ');toast('⚠ BOSS ENTRANT')}
function reward(e){state.money+=e.value;state.score+=Math.floor(e.value*12);state.kills++;floats.push({x:e.x,y:e.y,t:0,text:'+'+Math.floor(e.value)});for(let i=0;i<12;i++)spark(e.x,e.y,'dust')}
function kill(e){const i=enemies.indexOf(e);if(i<0)return;enemies.splice(i,1);reward(e);if(e.type==='soldier'&&Math.random()<.35){spawnEnemy('runner');spawnEnemy('runner')}}
function spark(x,y,type='spark'){particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.45,max:.45,r:Math.random()*3+1,type})}
function shoot(t){const b=base(),w=weapons[Math.min(state.weapon,weapons.length-1)],ang=Math.atan2(t.y-b.y,t.x-b.x),count=w[3];for(let i=0;i<count;i++){const off=(i-(count-1)/2)*.055;bullets.push({x:b.x,y:b.y,vx:Math.cos(ang+off)*780,vy:Math.sin(ang+off)*780,life:1.2,dmg:w[1]*(1+state.levels.damage*.15)*(Math.random()<state.crit?2.1:1)*(state.overdrive>0?2.4:1),rail:state.weapon>=4})}state.heat=Math.min(100,state.heat+1.8+state.weapon*.25);shake=Math.min(10,shake+1.1);shells.push({x:b.x,y:b.y,a:ang,t:0})}
function target(){const b=base(),max=Math.min(W,H)*.53*state.range;let best=null,bd=max;for(const e of enemies){const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;best=e}}if(boss){const d=Math.hypot(boss.x-b.x,boss.y-b.y);if(d<bd)return boss}return best}
function hitBoss(d){if(!boss)return;if(boss.shield>0){boss.shield-=d*.65;d*=.35;if(boss.shield<0){d+=-boss.shield;boss.shield=0;toast('BOUCLIER DU BOSS DÉTRUIT')}}boss.hp-=d;boss.phase=boss.hp<boss.max*.75?2:boss.hp<boss.max*.5?3:boss.hp<boss.max*.25?4:1}
function overdrive(){if(state.energy<45)return;state.energy-=45;state.overdrive=7;state.heat=Math.min(100,state.heat+25);toast('OVERDRIVE x2.4');log('Overdrive activé')}
function strike(){if(state.energy<70)return;state.energy-=70;for(let i=0;i<65;i++)particles.push({x:Math.random()*W,y:-20,vx:(Math.random()-.5)*80,vy:220+Math.random()*360,life:1.2,max:1.2,r:Math.random()*4+1,type:'fire'});for(const e of enemies.slice())kill(e);if(boss)hitBoss(600);shake=26;toast('FRAPPE D’ARTILLERIE');log('Frappe orbitale')}
function emp(){if(state.energy<30)return;state.energy-=30;state.emp=5;toast('EMP ACTIVÉ');log('Ennemis ralentis')}
function repair(){if(state.money<150||state.hp>=100)return;state.money-=150;state.hp=Math.min(100,state.hp+20);toast('BASE RÉPARÉE +20%');save()}
$('overdrive').onclick=overdrive;$('strike').onclick=strike;$('freeze').onclick=emp;$('repair').onclick=repair;$('pause').onclick=()=>{state.paused=!state.paused;$('pause').textContent=state.paused?'▶':'⏸'};$('save').onclick=save;$('reset').onclick=()=>{if(confirm('Réinitialiser la partie ?')){localStorage.removeItem('boosterRealistic');location.reload()}};
addEventListener('keydown',e=>{if(e.key==='Shift')overdrive();if(e.key===' ')strike();if(e.key.toLowerCase()==='f')emp();if(e.key.toLowerCase()==='r')repair()});
function update(dt){if(state.paused)return;time+=dt;state.energy=Math.min(100,state.energy+dt*2.7);state.heat=Math.max(0,state.heat-dt*4.5);if(state.overdrive>0)state.overdrive-=dt;if(state.emp>0)state.emp-=dt;
 if(state.wave%5===0&&!boss&&!nextWave)spawnBoss();if(!boss){spawn-=dt;if(spawn<=0){let n=1+Math.floor(state.wave*.45);for(let i=0;i<n;i++){const q=Math.random();spawnEnemy(q<.12?'runner':q<.22?'brute':q<.38?'soldier':'walker')}spawn=Math.max(.32,1.3-state.wave*.025)}}
 const b=base();for(const e of enemies){const dx=b.x-e.x,dy=b.y-e.y,d=Math.hypot(dx,dy)||1,slow=state.emp>0?.18:1;e.x+=dx/d*e.speed*slow*dt;e.y+=dy/d*e.speed*slow*dt;e.phase+=dt;if(d<65){state.hp-=Math.max(.2,e.damage*(1-state.armor*.05))*dt;shake=Math.min(9,shake+dt*3)}}
 shootTimer-=dt;const t=target();if(t&&shootTimer<=0&&state.heat<97){shoot(t);shootTimer=Math.max(.055,.32/(state.fire*weapons[Math.min(state.weapon,weapons.length-1)][2]))}
 for(const q of bullets){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let hit=false;for(const e of enemies){if(Math.hypot(q.x-e.x,q.y-e.y)<e.r+5){e.hp-=q.dmg;q.life=0;hit=true;for(let i=0;i<5;i++)spark(q.x,q.y);if(e.hp<=0)kill(e);break}}if(!hit&&boss&&Math.hypot(q.x-boss.x,q.y-boss.y)<boss.r+5){hitBoss(q.dmg);q.life=0;for(let i=0;i<8;i++)spark(q.x,q.y,'fire')}}
 bullets=bullets.filter(q=>q.life>0&&q.x>-80&&q.x<W+80&&q.y>-80&&q.y<H+80);
 if(boss){boss.t+=dt;const amp=boss.phase>=3?Math.min(W*.34,300):Math.min(W*.25,220);boss.x=W/2+Math.sin(boss.t*.65)*amp;boss.y=H*.2+Math.sin(boss.t*1.1)*35;if(boss.phase!==1&&Math.random()<dt*.28){for(let i=0;i<boss.phase-1;i++)spawnEnemy(i%2?'runner':'soldier')}if(boss.phase>=3&&Math.random()<dt*.18){for(let i=0;i<22;i++)spark(boss.x,boss.y,'fire');state.hp-=3;shake=12}if(boss.hp<=0){state.money+=1800+state.wave*150;state.score+=15000;toast('BOSS DÉTRUIT');log('Boss vaincu: récompense massive');for(let i=0;i<100;i++)spark(boss.x,boss.y,'fire');boss=null;$('boss').style.display='none';nextWave=2;state.wave++;save()}}
 if(!boss&&state.wave%5!==0&&enemies.length===0&&time>4){state.wave++;state.money+=70+state.wave*12;toast('VAGUE '+state.wave);log('Vague '+state.wave+' commencée');save()}
 if(nextWave>0){nextWave-=dt;if(nextWave<=0)nextWave=0}if(state.hp<=0){state.hp=0;state.paused=true;toast('BASE DÉTRUITE');log('Défaite')}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const s of shells)s.t+=dt;shells=shells.filter(s=>s.t<.15);for(const f of floats){f.y-=30*dt;f.t+=dt}floats=floats.filter(f=>f.t<1.1);shake=Math.max(0,shake-dt*18);ui()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawWorld();for(const e of enemies)drawZombie(e);if(boss)drawBoss(boss);for(const q of bullets)drawBullet(q);drawTurret(base());for(const s of shells){ctx.globalAlpha=1-s.t/.15;ctx.strokeStyle='#eee';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-Math.cos(s.a)*40,s.y-Math.sin(s.a)*40);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.type==='fire'?'#d88b4a':p.type==='dust'?'#777':'#ddd';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floats){ctx.fillStyle='#eee';ctx.font='bold 13px Arial';ctx.fillText(f.text,f.x,f.y)}ctx.restore()}
function drawWorld(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#15181b');g.addColorStop(.55,'#202224');g.addColorStop(1,'#0c0e10');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#17191b';ctx.fillRect(0,H*.56,W,H*.44);ctx.strokeStyle='#292c2e';ctx.lineWidth=2;for(let y=H*.58;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=-W;x<W*2;x+=120){ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.22,H*.56);ctx.lineTo(x,H);ctx.stroke()}for(let i=0;i<18;i++){const x=(i*137)%W,y=H*.28+(i*73)%(H*.27);ctx.fillStyle='#24282b';ctx.fillRect(x,y,40+(i%4)*20,15+(i%3)*15)}}
function drawTurret(b){const t=target();let a=t?Math.atan2(t.y-b.y,t.x-b.x)-Math.PI/2:-Math.PI/2;ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#090b0c';ctx.shadowBlur=25;ctx.shadowColor='#000';ctx.beginPath();ctx.ellipse(0,31,72,24,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#35393c';ctx.beginPath();ctx.ellipse(0,16,62,22,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#70757a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#202428';ctx.beginPath();ctx.arc(0,0,42,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#777c80';ctx.stroke();ctx.save();ctx.rotate(a);ctx.fillStyle='#181b1e';ctx.fillRect(-12,-58,24,55);ctx.fillStyle='#44494d';ctx.fillRect(-17,-72,34,17);ctx.fillStyle='#0d0f11';ctx.fillRect(-13,-86,26,16);ctx.fillStyle='#555b60';ctx.fillRect(-22,-55,6,18);ctx.fillRect(16,-55,6,18);ctx.restore();ctx.fillStyle='#171a1c';ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9b2f34';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawZombie(e){ctx.save();ctx.translate(e.x,e.y);const walk=Math.sin(e.phase*8)*3,scale=e.r/18;ctx.scale(scale,scale);ctx.shadowBlur=8;ctx.shadowColor='#000';let skin=e.type==='brute'?'#5b625c':e.type==='runner'?'#77766e':'#666a64';ctx.strokeStyle='#171918';ctx.lineWidth=3;ctx.lineCap='round';ctx.fillStyle='#262a28';ctx.beginPath();ctx.moveTo(-10,4);ctx.lineTo(-14,25+walk);ctx.lineTo(-5,27);ctx.lineTo(0,9);ctx.lineTo(7,27);ctx.lineTo(15,24-walk);ctx.lineTo(9,3);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-8,13,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#30332f';ctx.beginPath();ctx.moveTo(-13,-12);ctx.quadraticCurveTo(-3,-27,11,-17);ctx.lineTo(10,-9);ctx.lineTo(-12,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#b9b39c';ctx.beginPath();ctx.arc(-5,-8,2.2,0,Math.PI*2);ctx.arc(5,-8,2.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#202321';ctx.beginPath();ctx.moveTo(-11,1);ctx.lineTo(-21,10+walk);ctx.moveTo(11,1);ctx.lineTo(21,9-walk);ctx.stroke();if(e.type==='brute'){ctx.fillStyle='#333735';ctx.fillRect(-14,-1,28,18);ctx.strokeStyle='#777';ctx.strokeRect(-14,-1,28,18)}ctx.restore()}
